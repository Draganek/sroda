<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="twitter.png" />
    <title>Twitter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <img src="twitter.png" class="twitter-logo">
        <h1>Twitter</h1>

        <form id="tweetForm">
            <label for="username">Your username:</label>
            <input type="text" id="username" name="username" required>
            <label for="tweetContent">What's happening?</label>
            <textarea id="tweetContent" name="tweet" required></textarea>
            <button type="submit">Tweet</button>
        </form>

        <button id="clearButton" class="clear-button">Clear all</button>

        <div id="tweets"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
