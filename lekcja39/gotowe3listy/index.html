<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>

    <div class="container mt-5">
        <div class="row">
            <!-- Nieuporządkowana lista -->
            <div class="col-md-4">
                <div class="p-3 mb-3 bg-primary text-white rounded">

                    <h4>Nieuporządkowana lista</h4>
                    <ul>
                        <li>Element 1</li>
                        <li>Element 2</li>
                        <li>Element 3</li>
                        <li>Element 4</li>
                    </ul>
                </div>
            </div>
            <!-- Uporządkowana lista -->
            <div class="col-md-4">
                <div class="p-3 mb-3 bg-success text-white rounded">
                    <h4>Uporządkowana lista</h4>
                    <ol>
                        <li>Element 1</li>
                        <li>Element 2</li>
                        <li>Element 3</li>
                        <li>Element 4</li>
                    </ol>
                </div>
            </div>
            <!-- Lista bez stylów -->
            <div class="col-md-4">
                <div class="p-3 mb-3 bg-danger text-white rounded">
                    <h4>Lista bez stylów</h4>
                    <ul class="list-unstyled">
                        <li>Element 1</li>
                        <li>Element 2</li>
                        <li>Element 3</li>
                        <li>Element 4</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
