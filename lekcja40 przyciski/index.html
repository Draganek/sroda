<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body style="background-color: rgb(233, 236, 238);">

    <button class="btn btn-primary mt-3">Przycisk</button>
    <button class="btn btn-danger mt-3">Przycisk</button>
    <button class="btn btn-warning mt-3">Przycisk</button>
    <button class="btn btn-success mt-3">Przycisk</button>
    <button class="btn btn-secondary mt-3">Przycisk</button>
    <button class="btn btn-info mt-3">Przycisk</button>
    <button class="btn btn-dark mt-3">Przycisk</button>
    <button class="btn btn-light mt-3">Przycisk</button>
    <br>
    <button class="btn btn-outline-primary mt-3">Przycisk</button>
    <button class="btn btn-outline-danger mt-3">Przycisk</button>
    <button class="btn btn-outline-warning mt-3">Przycisk</button>
    <button class="btn btn-outline-secondary mt-3">Przycisk</button>
    <button class="btn btn-outline-info mt-3">Przycisk</button>
    <button class="btn btn-outline-dark mt-3">Przycisk</button>
    <button class="btn btn-outline-light mt-3">Przycisk</button>

    <div class="container">
        <h2>Przykładowe przyciski Bootstrap</h2>

        <div class="mb-3">
            <button class="btn btn-primary">Standardowy przycisk</button>
        </div>
        <div class="mb-3">
            <button class="btn btn-primary btn-lg">Duży przycisk</button>
        </div>
        <div class="mb-3">
            <button class="btn btn-primary btn-sm">Muniu puniu przycisk</button>
        </div>
        <div class="mb-3">
            <button class="btn btn-primary w-100">Pełny przycisk</button>
        </div>
        <div class="mb-3">
            <button class="btn btn-primary w-100 disabled">Nieaktywny przycisk</button>
        </div>
    </div>

    <div class="container mt-3">
        <h2>IKONKI Z PRZYCISKAMI</h2>

        <button class="btn btn-primary">
            <i class="bi bi-star-fill"></i>
            Favorite
        </button>

        <button class="btn btn-success">
            <i class="bi bi-check-lg"></i>
            Accept
        </button>
        <button class="btn btn-warning">
            <i class="bi bi-exclamation-octagon"></i>
            Caution!
        </button>
        <button class="btn btn-danger">
            <i class="bi bi-trash"></i>
            Trash
        </button>
    </div>

    <div class="container mt-3">
        <h2>Grupowane przyciski</h2>

        <div class="btn-group m-5">
            <button class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i>
            </button>
            <button class="btn btn-secondary">
                <i class="bi bi-house"></i>
            </button>
            <button class="btn btn-secondary">
                <i class="bi bi-arrow-right"></i>
            </button>
        </div>

    </div>

</body>

</html>
